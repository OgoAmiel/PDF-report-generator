<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Order Report</title>
    <style>
      @page { size: A4; margin: 16mm; }
      * { box-sizing: border-box; }
      body { color: #1d2630; font-family: Georgia, serif; font-size: 10pt; }
      h1 { margin: 0; color: #12344d; font-size: 25pt; }
      .report-date { margin: 5px 0 22px; color: #52616b; }
      .totals { display: flex; gap: 28px; margin-bottom: 24px; }
      .total { border-left: 4px solid #d68c45; padding-left: 12px; }
      .total-label { color: #52616b; font-size: 9pt; text-transform: uppercase; }
      .total-value { font-size: 19pt; font-weight: bold; }
      h2 { margin: 22px 0 8px; color: #12344d; font-size: 15pt; }
      table { border-collapse: collapse; margin-bottom: 24px; width: 100%; }
      th { background: #12344d; color: #fff; font-weight: bold; text-align: left; }
      th, td { border: 1px solid #cfd8dc; padding: 6px 8px; }
      tbody tr:nth-child(even) { background: #f2f6f5; }
      td:nth-child(1), td:nth-child(4) { text-align: right; }
      @media print {
        thead { display: table-header-group; }
        tr { break-inside: avoid; page-break-inside: avoid; }
      }
    </style>
  </head>
  <body>
    <h1>Order Report</h1>
    <p class="report-date" id="report-date"></p>
    <section class="totals">
      <div class="total"><div class="total-label">Total Orders</div><div class="total-value" id="total-orders"></div></div>
      <div class="total"><div class="total-label">Total Revenue</div><div class="total-value" id="total-revenue"></div></div>
    </section>
    <h2>Top 5 Products by Revenue</h2>
    <table>
      <thead><tr><th>Product</th><th>Revenue</th></tr></thead>
      <tbody id="top-product-rows"></tbody>
    </table>
    <h2>All Orders</h2>
    <table>
      <thead><tr><th>ID</th><th>Customer</th><th>Product</th><th>Amount</th><th>Created At</th></tr></thead>
      <tbody id="order-rows"></tbody>
    </table>
    <script>
      const reportData = {{REPORT_DATA}};
      const currency = new Intl.NumberFormat("en-US", {
        style: "currency", currency: "USD", maximumFractionDigits: 0
      });
      const today = new Intl.DateTimeFormat("en-US", { dateStyle: "long" }).format(new Date());

      document.title = `Order Report - ${today}`;
      document.querySelector("#report-date").textContent = today;
      document.querySelector("#total-orders").textContent = reportData.total_orders;
      document.querySelector("#total-revenue").textContent = currency.format(reportData.total_revenue);

      function appendRow(tableBody, values) {
        const row = document.createElement("tr");
        values.forEach((value) => {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        });
        tableBody.appendChild(row);
      }

      const topProductsBody = document.querySelector("#top-product-rows");
      reportData.top_products_by_revenue.forEach(({ product, revenue }) => {
        appendRow(topProductsBody, [product, currency.format(revenue)]);
      });

      const ordersBody = document.querySelector("#order-rows");
      reportData.all_orders.forEach(({ id, customer, product, amount, created_at }) => {
        appendRow(ordersBody, [id, customer, product, currency.format(amount), created_at]);
      });
    </script>
  </body>
</html>
